name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate package and release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e '
            const p = require("./package.json");
            if (p.name !== "@kahme247/pi-swarm" || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(p.version) || process.env.RELEASE_TAG !== `v${p.version}`) {
              throw new Error("Package name or stable version does not match release tag");
            }
          '
          LATEST="$(npm view @kahme247/pi-swarm dist-tags.latest)"
          LATEST="$LATEST" node -e '
            const v = require("./package.json").version.split(".").map(BigInt);
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(process.env.LATEST)) throw new Error("Invalid npm latest version");
            const latest = process.env.LATEST.split(".").map(BigInt);
            const firstDifference = v.findIndex((n, i) => n !== latest[i]);
            if (firstDifference < 0 || v[firstDifference] < latest[firstDifference]) throw new Error("Release version must be newer than npm latest");
          '
      - name: Install host SDK for tests
        run: npm install --no-save --ignore-scripts --package-lock=false @earendil-works/pi-coding-agent@1.5.2 @earendil-works/pi-tui@1.5.2
      - run: npm test
      - name: Pack and publish
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm publish "$RUNNER_TEMP/kahme247-pi-swarm-$(node -p 'require("./package.json").version').tgz" --access public
